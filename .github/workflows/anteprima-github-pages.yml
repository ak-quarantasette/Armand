name: Anteprima su GitHub Pages

# Tiene aggiornata l'anteprima su https://<utente>.github.io/<repo>/.
#
# GitHub Pages qui è impostato su "Deploy from a branch" (ramo main, cartella principale): GitHub pubblica i
# file della repo così come sono. Per questo nella repo ci sono le pagine già pronte:
#   anteprima/   il sito costruito
#   index.html   copia della home, perché l'indirizzo principale si apra subito
#   404.html     copia della pagina di errore
#   .nojekyll    dice a GitHub di non rielaborare i file
# A ogni modifica di main questo flusso ricostruisce il sito, aggiorna quei file, li salva su main e chiede
# a GitHub di ripubblicare. Sono file generati: non vanno modificati a mano.

on:
  push:
    branches: [main]
    paths-ignore: ['anteprima/**', 'index.html', '404.html']
  workflow_dispatch:

permissions:
  contents: write # per salvare su main le pagine ricostruite
  pages: write # per chiedere a GitHub Pages di ripubblicare

concurrency:
  group: anteprima
  cancel-in-progress: false

jobs:
  anteprima:
    name: Ricostruisce e pubblica l'anteprima
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installa e costruisce in dist/. Il sito vive nella sottocartella <repo>/anteprima e, non avendo
      # ancora un dominio, resta fuori da Google (vedi DOMINIO in astro.config.mjs).
      - uses: withastro/action@v6
        env:
          SITO_BASE: /${{ github.event.repository.name }}/anteprima
          ANTEPRIMA_URL: https://${{ github.repository_owner }}.github.io

      - name: Aggiorna le pagine pronte nella repo
        id: pagine
        run: |
          rm -rf anteprima
          cp -r dist anteprima
          cp anteprima/index.html index.html
          cp anteprima/404.html 404.html
          touch .nojekyll
          git add -A anteprima index.html 404.html .nojekyll
          if git diff --cached --quiet; then
            echo "Le pagine pronte sono già aggiornate: niente da salvare."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --quiet -m "Aggiorna l'anteprima pubblicata" -m "Pagine ricostruite in automatico dal flusso anteprima-github-pages."
            git pull --quiet --rebase origin main
            git push --quiet origin HEAD:main
            echo "cambiate=si" >> "$GITHUB_OUTPUT"
            echo "Pagine pronte aggiornate e salvate su main."
          fi

      # I salvataggi fatti da questo flusso non fanno ripartire da soli la pubblicazione: va chiesta.
      - name: Chiede a GitHub Pages di ripubblicare
        if: steps.pagine.outputs.cambiate == 'si' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tipo=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo spento)
          case "$tipo" in
            legacy)
              if esito=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status 2>&1); then
                echo "GitHub Pages sta ripubblicando l'anteprima (stato: $esito)."
              else
                echo "::warning::Non sono riuscito a chiedere la ripubblicazione a GitHub Pages: $esito. L'anteprima si aggiornerà alla prossima modifica di main."
              fi
              ;;
            workflow)
              echo "::warning::GitHub Pages è impostato su \"GitHub Actions\". Per questa anteprima serve \"Deploy from a branch\" con ramo main e cartella / (root): Settings → Pages."
              ;;
            *)
              echo "::notice::GitHub Pages è spento: le pagine sono pronte nella repo ma non sono pubblicate. Per accenderlo: Settings → Pages → Deploy from a branch → main → / (root)."
              ;;
          esac
